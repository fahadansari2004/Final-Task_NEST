<div class="card glass-card h-100 overflow-hidden" [routerLink]="['/food', recipe.id]">
  <!-- Card Image Section -->
  <div class="image-wrapper position-relative">
    <img [src]="recipe.image" [alt]="recipe.name" class="card-img-top food-image" loading="lazy">
    <div class="cuisine-badge position-absolute top-3 start-3">
      <span class="badge font-accent">{{ recipe.cuisine }}</span>
    </div>
  </div>

  <!-- Card Body Section -->
  <div class="card-body d-flex flex-column p-4">
    <h3 class="card-title h5 mb-2 text-truncate" [title]="recipe.name">{{ recipe.name }}</h3>
    
    <!-- Meta Info: Rating & Time -->
    <div class="d-flex align-items-center justify-content-between mb-3 text-secondary small font-accent">
      <div class="rating-info">
        <i class="fa-solid fa-star text-warning me-1"></i>
        <span class="text-white fw-medium">{{ recipe.rating }}</span> 
        <span class="text-muted">({{ recipe.reviewCount }})</span>
      </div>
      <div class="time-info">
        <i class="fa-solid fa-clock text-gold me-1"></i>
        <span>{{ recipe.prepTimeMinutes + recipe.cookTimeMinutes }} mins</span>
      </div>
    </div>

    <!-- Category Label -->
    <p class="text-muted small mb-3">
      <i class="fa-solid fa-utensils me-1 text-gold"></i> Category: <strong>{{ recipe.category }}</strong>
    </p>

    <!-- Price and Add to Cart Section -->
    <div class="d-flex align-items-center justify-content-between mt-auto pt-3 border-top border-light">
      <div class="price-container">
        <span class="text-muted small d-block font-accent">Price</span>
        <span class="price-val text-gold h5 mb-0 fw-bold font-accent">${{ recipe.price | number:'1.2-2' }}</span>
      </div>
      <div class="actions">
        <button class="btn-cart-circle" (click)="addToCart($event)" title="Add to Cart">
          <i class="fa-solid fa-cart-plus"></i>
        </button>
      </div>
    </div>
  </div>
</div>
