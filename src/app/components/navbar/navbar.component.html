<nav class="navbar navbar-expand-lg fixed-top transition-all" [ngClass]="{'scrolled-nav': isScrolled, 'glass-nav': !isScrolled}">
  <div class="container">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <i class="fa-solid fa-fire-burner text-gold me-2 brand-icon"></i>
      <span class="brand-text">Foodie<span class="text-gold">Hub</span></span>
    </a>

    <!-- Cart icon for mobile view (shows next to hamburger) -->
    <div class="d-flex align-items-center d-lg-none ms-auto me-3">
      <a class="nav-link cart-icon-wrapper position-relative" routerLink="/cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="badge rounded-pill bg-gold-badge position-absolute top-0 start-100 translate-middle" *ngIf="cartCount > 0">
          {{ cartCount }}
        </span>
      </a>
    </div>

    <!-- Toggler Button -->
    <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="toggler-icon-bar"></span>
      <span class="toggler-icon-bar"></span>
      <span class="toggler-icon-bar"></span>
    </button>

    <!-- Navigation links -->
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/menu" routerLinkActive="active">Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
        </li>
        <li class="nav-item mt-3 mt-lg-0 ms-lg-3">
          <a class="btn btn-gold px-4 py-2" routerLink="/reservation">Book A Table</a>
        </li>
        <!-- Cart icon for desktop -->
        <li class="nav-item d-none d-lg-block ms-lg-3">
          <a class="nav-link cart-icon-wrapper position-relative" routerLink="/cart" routerLinkActive="active">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="badge rounded-pill bg-gold-badge position-absolute" *ngIf="cartCount > 0">
              {{ cartCount }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
