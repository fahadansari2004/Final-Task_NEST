<!-- Menu Header Banner -->
<section class="menu-banner position-relative d-flex align-items-center justify-content-center overflow-hidden">
  <div class="banner-bg position-absolute top-0 start-0 w-100 h-100"></div>
  <div class="dark-overlay position-absolute top-0 start-0 w-100 h-100"></div>
  <div class="container position-relative z-1 text-center py-5">
    <h1 class="display-4 fw-bold text-white mb-2">Our Exquisite Menu</h1>
    <p class="text-gold font-accent text-uppercase tracking-wide mb-0">Crafted with passion, served with pride</p>
  </div>
</section>

<!-- Menu Content Section -->
<section class="section-padding bg-dark" id="menu-listing">
  <div class="container">
    
    <!-- Filter Toolbar: Categories and Search -->
    <div class="row g-4 justify-content-between align-items-center mb-5">
      <!-- Category Pills -->
      <div class="col-xl-8 col-lg-7">
        <div class="d-flex flex-wrap gap-2 category-scroll">
          <button 
            *ngFor="let cat of categories" 
            class="btn filter-pill font-accent" 
            [class.active-pill]="selectedCategory === cat"
            (click)="selectCategory(cat)">
            {{ cat }}
          </button>
        </div>
      </div>
      
      <!-- Search Input -->
      <div class="col-xl-4 col-lg-5">
        <div class="search-wrapper position-relative">
          <i class="fa-solid fa-magnifying-glass search-icon text-muted"></i>
          <input 
            type="text" 
            class="form-control form-control-dark search-input ps-5" 
            placeholder="Search dish, cuisine, or tags..." 
            [(ngModel)]="searchQuery" 
            (ngModelChange)="onSearchChange()">
        </div>
      </div>
    </div>

    <!-- Spinner / Loading skeleton -->
    <div class="row g-4" *ngIf="isLoading">
      <div class="col-lg-4 col-md-6" *ngFor="let skeleton of [1, 2, 3, 4, 5, 6]">
        <div class="skeleton-card"></div>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state text-center py-5 glass-card" *ngIf="!isLoading && paginatedRecipes.length === 0">
      <i class="fa-solid fa-utensils text-gold mb-4 display-3"></i>
      <h3 class="h4 text-white mb-2">No Delicacies Found</h3>
      <p class="text-secondary max-w-600 mx-auto">We couldn't find any recipes matching "{{ searchQuery }}". Please try adjusting your search terms or choosing another category.</p>
      <button class="btn btn-gold mt-3 px-4 py-2" (click)="searchQuery=''; selectCategory('All')">Reset Filters</button>
    </div>

    <!-- Food Grid -->
    <div class="row g-4" *ngIf="!isLoading && paginatedRecipes.length > 0">
      <div class="col-lg-4 col-md-6 fade-in" *ngFor="let recipe of paginatedRecipes">
        <app-food-card [recipe]="recipe"></app-food-card>
      </div>
    </div>

    <!-- Pagination Controls -->
    <nav class="d-flex justify-content-center mt-5" aria-label="Menu pagination" *ngIf="!isLoading && totalPages > 1">
      <ul class="pagination custom-pagination gap-2">
        <!-- Previous Page Button -->
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="goToPage(currentPage - 1)" aria-label="Previous">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
        </li>

        <!-- Page Numbers -->
        <li class="page-item" *ngFor="let page of getPagesArray()" [class.active]="currentPage === page">
          <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
        </li>

        <!-- Next Page Button -->
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="goToPage(currentPage + 1)" aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </li>
      </ul>
    </nav>

  </div>
</section>
